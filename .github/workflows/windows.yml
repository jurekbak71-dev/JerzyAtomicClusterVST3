name: Windows x64 VST3
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Fetch pinned Steinberg SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git dependencies/vst3sdk
          git -C dependencies/vst3sdk checkout --detach 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C dependencies/vst3sdk submodule update --init --recursive
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT="${{ github.workspace }}/dependencies/vst3sdk"
      - name: Build and validate VST3
        run: cmake --build build --parallel 4
      - name: DSP and processor state tests
        run: ctest --test-dir build --output-on-failure
      - name: Exercise Windows pedal GUI
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          binary = next(x for x in Path('build/VST3').rglob('JerzyAtomicCluster.vst3') if x.is_file())
          subprocess.run(['build/editor_smoke.exe', str(binary.resolve()), 'build/editor.bmp'], check=True)
      - name: Package
        run: python tools/package.py --build build --sdk dependencies/vst3sdk
      - uses: actions/upload-artifact@v4
        with:
          name: JerzyAtomicClusterVST3-Win64
          path: dist/*
          if-no-files-found: error
